<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>租房管理 · 年度看板</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="brand-title">租房管理</span>
      </div>
      <ul class="sidebar-menu">
        <li><a href="/dashboard.html" class="active"><span class="menu-icon">📊</span> 年度看板</a></li>
        <li><a href="/rooms.html"><span class="menu-icon">🏠</span> 房间管理</a></li>
        <li><a href="/tenants.html"><span class="menu-icon">👥</span> 租客档案</a></li>
        <li><a href="/rent-records.html"><span class="menu-icon">💳</span> 收租账单</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn-sidebar-logout" onclick="logout()">
          <span>✕</span> 退出登录
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">年度收支总览</span>
          <span class="topbar-badge" id="currentYearBadge">2026</span>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="todayDate"></span>
          <div class="user-menu" id="userMenu">
            <div class="user-btn" onclick="toggleUserMenu()">
              <div class="user-avatar" id="userAvatar">A</div>
              <span class="user-name" id="topbarUser">admin</span>
              <span class="user-arrow">▼</span>
            </div>
            <div class="user-dropdown">
              <div class="user-dropdown-item" onclick="openChangePasswordModal()">
                <span>🔑</span> 修改密码
              </div>
              <div class="user-dropdown-item danger" onclick="logout()">
                <span>🚪</span> 退出登录
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="content">
        <!-- 筛选栏 -->
        <div class="search-bar" style="margin-bottom: 20px;">
          <select id="filterYear" onchange="loadDashboard()"></select>
          <button class="btn btn-default btn-sm" onclick="loadDashboard()">刷新数据</button>
        </div>

        <!-- 汇总卡片 -->
        <div class="stat-grid">
          <div class="stat-card">
            <div class="label">年度实收总额 (租金+水电杂费)</div>
            <div class="value" id="totalIncome" style="letter-spacing: -0.5px;">-</div>
          </div>
          <div class="stat-card">
            <div class="label">年度实收纯租金</div>
            <div class="value" id="totalRent">-</div>
          </div>
          <div class="stat-card">
            <div class="label">实收电费</div>
            <div class="value" id="totalElectricFee">-</div>
            <div class="sub-value" id="totalElectricUsage">-</div>
          </div>
          <div class="stat-card">
            <div class="label">实收水费</div>
            <div class="value" id="totalWaterFee">-</div>
            <div class="sub-value" id="totalWaterUsage">-</div>
          </div>
          <div class="stat-card">
            <div class="label">宽带与充电费</div>
            <div class="value" id="totalOtherFee">-</div>
          </div>
        </div>

        <!-- 月度明细 -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">月度财务明细表（已实收结算）</span>
          </div>
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>月份</th>
                  <th>实收纯租金 (元)</th>
                  <th>用电量 (度)</th>
                  <th>电费 (元)</th>
                  <th>用水量 (吨)</th>
                  <th>水费 (元)</th>
                  <th>月度总实收 (元)</th>
                </tr>
              </thead>
              <tbody id="monthlyBody"></tbody>
              <tfoot id="monthlyFoot"></tfoot>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
