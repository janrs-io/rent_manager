<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>租房管理 · 登录</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-header">
        <div class="login-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <h1 class="login-title">租房管理</h1>
        <p class="login-desc">登录进入物业与收租管理控制台</p>
      </div>

      <div class="error-banner" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">管理员账号</label>
          <input type="text" id="username" placeholder="yjy86868@gmail.com" autocomplete="username" required autofocus />
        </div>
        <div class="form-group" style="margin-bottom: 22px;">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">登录系统</button>
      </form>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
