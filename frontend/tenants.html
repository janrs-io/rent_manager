<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>租房管理 · 租客档案</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="brand-title">租房管理</span>
      </div>
      <ul class="sidebar-menu">
        <li><a href="/dashboard.html"><span class="menu-icon">📊</span> 年度看板</a></li>
        <li><a href="/rooms.html"><span class="menu-icon">🏠</span> 房间管理</a></li>
        <li><a href="/tenants.html" class="active"><span class="menu-icon">👥</span> 租客档案</a></li>
        <li><a href="/rent-records.html"><span class="menu-icon">💳</span> 收租账单</a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn-sidebar-logout" onclick="logout()">
          <span>✕</span> 退出登录
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">租客自然人档案</span>
          <span class="topbar-badge" id="tenantCountBadge">共 0 位在租租客</span>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" id="todayDate"></span>
          <div class="user-menu" id="userMenu">
            <div class="user-btn" onclick="toggleUserMenu()">
              <div class="user-avatar" id="userAvatar">A</div>
              <span class="user-name" id="topbarUser">admin</span>
              <span class="user-arrow">▼</span>
            </div>
            <div class="user-dropdown">
              <div class="user-dropdown-item" onclick="openChangePasswordModal()">
                <span>🔑</span> 修改密码
              </div>
              <div class="user-dropdown-item danger" onclick="logout()">
                <span>🚪</span> 退出登录
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="card">
          <div class="card-header">
            <div class="search-bar">
              <input type="text" id="filterKeyword" placeholder="搜索租客姓名、手机号、身份证或房间号..." oninput="filterTenants()" style="width: 300px;" />
              <select id="filterStatus" onchange="filterTenants()">
                <option value="active" selected>仅在租租客</option>
                <option value="inactive">仅已退租租客</option>
                <option value="all">全部租客档案</option>
              </select>
            </div>
            <div>
              <button class="btn btn-primary btn-sm" onclick="openModal()">+ 录入新租客</button>
            </div>
          </div>

          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>租客姓名</th>
                  <th>承租角色</th>
                  <th>所住房间</th>
                  <th>性别 / 周岁</th>
                  <th>联系电话</th>
                  <th>身份证号</th>
                  <th>起租入住日</th>
                  <th>当前状态</th>
                  <th style="text-align: right;">操作</th>
                </tr>
              </thead>
              <tbody id="tenantBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 新增/编辑租客弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal modal-medium">
      <div class="modal-header">
        <span id="modalTitle">录入新租客</span>
        <span class="modal-close" onclick="closeModal()">✕</span>
      </div>
      <div class="modal-body">
        <form id="tenantForm">
          <input type="hidden" id="tenantId" />
          <div class="form-row">
            <div class="form-group">
              <label>租客姓名 <span class="required">*</span></label>
              <input type="text" id="name" placeholder="租客姓名" required />
            </div>
            <div class="form-group">
              <label>性别</label>
              <select id="gender">
                <option value="male">男</option>
                <option value="female">女</option>
                <option value="unknown">未知</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>联系电话</label>
              <input type="text" id="phone" placeholder="手机号码" />
            </div>
            <div class="form-group">
              <label>身份证号</label>
              <input type="text" id="id_card" maxlength="18" placeholder="18位居民身份证号" />
            </div>
          </div>

          <div class="form-group">
            <label>籍贯 / 户籍地址</label>
            <input type="text" id="address" placeholder="省市区详细地址" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>分配房间号 <span class="required">*</span></label>
              <input type="text" id="room_no" placeholder="如 101, 202" required />
            </div>
            <div class="form-group">
              <label>起租入住日期 <span class="required">*</span></label>
              <input type="date" id="move_in_date" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>承租月租金(元) <span class="required">*</span></label>
              <input type="number" id="rent_amount" min="0" step="0.01" placeholder="400" required />
            </div>
            <div class="form-group">
              <label>承租押金(元)</label>
              <input type="number" id="deposit" min="0" step="0.01" value="0" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>承租角色身份</label>
              <select id="is_primary">
                <option value="1">主承租人 (主签约交租)</option>
                <option value="0">合租同住人 (家属/室友)</option>
              </select>
            </div>
            <div class="form-group">
              <label>在租状态</label>
              <select id="status">
                <option value="active">在租中</option>
                <option value="inactive">已退租</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default btn-sm" onclick="closeModal()">取消</button>
        <button class="btn btn-primary btn-sm" onclick="submitTenantForm()">保存档案</button>
      </div>
    </div>
  </div>

  <!-- 租客明细档案弹窗 -->
  <div class="modal-mask" id="tenantDetailMask">
    <div class="modal" style="max-width: 440px;">
      <div class="modal-header">
        <span>租客档案卡片</span>
        <span class="modal-close" onclick="closeTenantDetail()">✕</span>
      </div>
      <div class="modal-body" id="tenantDetailContent"></div>
      <div class="modal-footer">
        <button class="btn btn-default btn-sm" onclick="closeTenantDetail()">关闭</button>
      </div>
    </div>
  </div>

  <!-- 办理退租清算弹窗 -->
  <div class="modal-mask" id="checkoutModalMask">
    <div class="modal" style="max-width: 460px;">
      <div class="modal-header">
        <span>办理租客退租结算</span>
        <span class="modal-close" onclick="closeCheckoutModal()">✕</span>
      </div>
      <div class="modal-body">
        <form id="checkoutForm">
          <input type="hidden" id="checkoutTenantId" />
          <input type="hidden" id="checkoutDepositPaid" />

          <div style="background:#f4f4f6;border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
              <span style="color:#71717a">退租租客 / 房间：</span>
              <strong id="checkoutTenantDesc">-</strong>
            </div>
            <div style="display:flex;justify-content:space-between;">
              <span style="color:#71717a">已收原始房屋押金：</span>
              <strong id="checkoutDepositDisplay" style="color:#09090b;font-size:14px;">¥0.00</strong>
            </div>
          </div>

          <div class="form-group">
            <label>实际搬离结算日 <span class="required">*</span></label>
            <input type="date" id="checkout_date" required />
          </div>

          <div class="form-section-divider">押金扣除项目明细</div>
          <div class="form-row">
            <div class="form-group">
              <label>扣除未结租金 (元)</label>
              <input type="number" id="deduct_rent" min="0" step="0.01" value="0" oninput="calcCheckoutRefund()" />
            </div>
            <div class="form-group">
              <label>扣除未结水电费 (元)</label>
              <input type="number" id="deduct_utility" min="0" step="0.01" value="0" oninput="calcCheckoutRefund()" />
            </div>
          </div>
          <div class="form-group">
            <label>扣除房屋保洁 / 设施损坏赔偿 (元)</label>
            <input type="number" id="deduct_damage" min="0" step="0.01" value="0" oninput="calcCheckoutRefund()" />
          </div>

          <div class="form-group">
            <label>退租结算备注</label>
            <input type="text" id="checkout_note" placeholder="如 钥匙已归还 / 扣除50元卫生费等" />
          </div>

          <div style="background:#18181b;color:#fff;border-radius:6px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
            <span style="font-size:13px;">实退租客押金金额：</span>
            <span id="checkoutRefundDisplay" style="font-size:18px;font-weight:700;color:#86efac;">¥0.00</span>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default btn-sm" onclick="closeCheckoutModal()">取消</button>
        <button class="btn btn-primary btn-sm" onclick="submitCheckoutForm()">确认结算并办理退租</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/tenants.js"></script>
</body>
</html>
